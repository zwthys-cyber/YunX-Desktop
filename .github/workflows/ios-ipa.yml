name: iOS 17 IPA (development)

on:
  push:
    branches: [ios-port]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      package_style:
        description: IPA installation format
        type: choice
        default: resign
        options: [resign, trollstore, both]
      macos_runner:
        description: GitHub standard macOS runner
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15]

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  # Preserve the current run's tests and IPA; the latest push waits its turn.
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64 IPA for iOS 17
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout iOS sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ios
            LICENSE

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Install Go for native iOS engine
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Identify engine toolchain
        id: engine-toolchain
        shell: bash
        run: |
          yunx_toolchain_key="$({ xcodebuild -version; go version; xcrun --sdk iphoneos --show-sdk-version; xcrun --sdk iphonesimulator --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=$yunx_toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Restore native iOS engine
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Frameworks/Yunxengine.xcframework
            ios/build/YunX-Gopeed-corresponding-source.tar.gz
            ios/build/engine-source-revisions.txt
          key: yunx-engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh') }}

      - name: Restore Go dependency and compiler cache
        id: go-engine-cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh') }}-${{ github.run_id }}
          restore-keys: |
            go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh') }}-
            go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-

      - name: Build native Gopeed XCFramework
        id: engine-build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ios/build
          bash ios/build-engine.sh 2>&1 | tee ios/build/engine.log

      - name: Preserve built engine even if app tests fail
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Frameworks/Yunxengine.xcframework
            ios/build/YunX-Gopeed-corresponding-source.tar.gz
            ios/build/engine-source-revisions.txt
          key: yunx-engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh') }}

      - name: Preserve Go cache before app checks
        if: always() && (steps.engine-build.outcome == 'success' || steps.engine-build.outcome == 'failure') && steps.go-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh') }}-${{ github.run_id }}

      - name: Show generated native networking bridge declarations
        shell: bash
        run: find ios/Frameworks/Yunxengine.xcframework -name '*.h' -exec grep -nE 'ProxyResolver|resolve:|SetProxyResolver|SetNativeHTTPBandwidthLimit|SetNativeHTTPTransport|HeaderResolver|headers:' {} +

      - name: Install JDK for desktop backup interoperability fixtures
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore simulator SDK module cache
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: ios/build/SimulatorDerivedData/ModuleCache.noindex
          key: swift-ios-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh', 'ios/project.yml') }}-${{ github.run_id }}
          restore-keys: |
            swift-ios-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh', 'ios/project.yml') }}-
            swift-ios-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-

      - name: Compile simulator app and test bundle
        id: simulator-build
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ios/build
          bash ios/test-ios.sh build 2>&1 | tee ios/build/tests-build.log

      - name: Preserve compiler-owned SDK cache
        if: always() && (steps.simulator-build.outcome == 'success' || steps.simulator-build.outcome == 'failure') && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/build/SimulatorDerivedData/ModuleCache.noindex
          key: swift-ios-${{ runner.arch }}-${{ steps.engine-toolchain.outputs.key }}-${{ hashFiles('ios/Engine/**', 'ios/build-engine.sh', 'ios/project.yml') }}-${{ github.run_id }}

      - name: Run offline protocol tests on iOS Simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          bash ios/test-ios.sh run 2>&1 | tee ios/build/tests.log

      - name: Compile and package IPA
        env:
          YUNX_PACKAGE_STYLE: ${{ inputs.package_style || 'resign' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ios/build
          bash ios/build-local.sh 2>&1 | tee ios/build/build.log

      - name: Upload IPA and checksum
        id: ipa
        uses: actions/upload-artifact@v7.0.2
        with:
          name: YunX-iOS-${{ inputs.package_style || 'resign' }}-dev
          path: |
            ios/build/*.ipa
            ios/build/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload engine corresponding source
        if: always() && (steps.engine-cache.outputs.cache-hit == 'true' || steps.engine-build.outcome == 'success')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: YunX-Gopeed-corresponding-source
          path: |
            ios/build/YunX-Gopeed-corresponding-source.tar.gz
            ios/build/engine-source-revisions.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: YunX-iOS-build-log
          path: |
            ios/build/*.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        env:
          ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          {
            echo '### YunX iOS development IPA'
            echo
            echo "Download: $ARTIFACT_URL"
            echo
            echo 'arm64 device build; iOS 17.0 minimum. Default outputs are IPAs for the user to re-sign with a valid certificate and provisioning profile.'
            echo 'Resign: compatibility package without the share extension. Resign-Share: full package; sign the app and extension and configure matching App Groups for the shared inbox.'
            echo 'The explicit TrollStore format remains optional. See ios/PORTING.md for current feature and device acceptance status.'
            echo 'Compilation/package checks do not verify installation or runtime on a real device.'
          } >> "$GITHUB_STEP_SUMMARY"
