name: YunX
options:
  bundleIdPrefix: io.github.zwthys
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  YunX:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - target: YunXShare
        embed: true
      - framework: Frameworks/Yunxengine.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libresolv.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zwthys.yunx
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: YunX
        CODE_SIGN_ENTITLEMENTS: SharedGroup.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 云析
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
  YunXShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        includes:
          - "**/*.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zwthys.yunx.share
        PRODUCT_NAME: YunXShare
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 保存到云析
        CODE_SIGN_ENTITLEMENTS: SharedGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
  YunXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: YunX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zwthys.yunx.tests
schemes:
  YunX:
    build:
      targets:
        YunX: all
    test:
      config: Debug
      targets:
        - name: YunXTests
          parallelizable: false
